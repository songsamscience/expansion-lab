            recs = []; answers = {}; revisions = {}; locks = {}; hints = {}; foundOnce = false;
            Object.assign(B, BENCH0()); Object.assign(CZ, COSMOS0());
            mcq = null; mcq = newMcq(false);
            closeModal(); go(S.screen); toast('이 탭의 기록을 모두 지웠어요.');
          };
        },
      });
    },
  });
}

/* ═════════════ 결과 저장 (PNG) ═════════════ */
const INLINE_PROPS = ['fill', 'fill-opacity', 'fill-rule', 'stroke', 'stroke-width', 'stroke-opacity', 'stroke-dasharray', 'stroke-dashoffset', 'stroke-linecap', 'stroke-linejoin', 'opacity', 'font-family', 'font-size', 'font-weight', 'text-anchor', 'dominant-baseline', 'paint-order', 'stop-color', 'stop-opacity', 'display', 'visibility', 'letter-spacing', 'font-variant-numeric', 'mix-blend-mode'];
function inlineTree(src, dst) {
  const cs = getComputedStyle(src);
  let st = '';
  for (const p of INLINE_PROPS) { const v = cs.getPropertyValue(p); if (v !== '' && v !== 'normal' || p === 'fill') st += `${p}:${v};`; }
  dst.setAttribute('style', st); dst.removeAttribute('class');
  const a = src.children, b = dst.children;
  for (let i = 0; i < a.length && i < b.length; i++) inlineTree(a[i], b[i]);
}
function svgToImage(svg, outW) {
  const clone = svg.cloneNode(true);
  inlineTree(svg, clone);
  clone.querySelectorAll('.focus-ring,[data-noexport]').forEach(e => e.remove());
  clone.querySelectorAll('[tabindex]').forEach(e => e.removeAttribute('tabindex'));
  const vb = svg.viewBox.baseVal, outH = Math.round(outW * vb.height / vb.width);
  clone.setAttribute('width', outW); clone.setAttribute('height', outH); clone.setAttribute('xmlns', NS);
  clone.style.removeProperty('--px');
  const data = new XMLSerializer().serializeToString(clone);
  const url = URL.createObjectURL(new Blob([data], { type: 'image/svg+xml;charset=utf-8' }));
  return new Promise((ok, no) => { const img = new Image(); img.onload = () => { URL.revokeObjectURL(url); ok({ img, w: outW, h: outH }); }; img.onerror = e => { URL.revokeObjectURL(url); no(e); }; img.src = url; });
}
function wrapText(ctx, text, maxW) {
  const words = text.split(' '), lines = []; let line = '';
  for (const w of words) { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; }
  if (line) lines.push(line);
  return lines;
}
async function capture() {
  if (!isLab()) return;
  const btn = $('#saveBtn'); if (!btn || btn.getAttribute('aria-busy') === 'true') return;
  btn.setAttribute('aria-busy', 'true');
  const slow = setTimeout(() => toast('결과 이미지를 만드는 중이에요…'), 700);
  try {
    const css = getComputedStyle(document.documentElement), tok = n => css.getPropertyValue(n).trim();
    const sc = SCREEN_BY[S.screen];
    const svg = cur.scene && cur.scene.svg; if (!svg) throw new Error('noscene');
    let lines;
    if (S.screen === 'bench') {
      lines = cur.scene.statusLines();
      const M = recModel();
      if (recs.length) lines.state += ' · 기록: ' + M.rows.map(k => { const [a, b] = k.split('-').map(Number); return `${pairName(a, b)} ` + M.sizes.filter(D => M.val(k, D) != null).map(D => `${cm1(M.val(k, D))}(지름 ${cm1(D)})`).join('→'); }).join(', ') + ' cm';
    } else lines = cosmosStatusLines();
    const r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal, fit = Math.min(r.width / vb.width, r.height / vb.height);
    const outW = Math.round(Math.min(2400, Math.max(1200, vb.width * fit * 2)));
    const g = await svgToImage(svg, outW);
    await band(outW, g.h, [{ img: g.img, x: 0, y: 0, w: g.w, h: g.h }], lines, sc, tok);
    if (!REDUCED) { const f = document.createElement('div'); f.className = 'shutter'; $('#stage').appendChild(f); setTimeout(() => f.remove(), 340); }
  } catch (e) {
    toast('이미지로 저장하지 못했어요. 기기의 화면 캡처를 이용해 주세요.', { error: true });
  } finally { clearTimeout(slow); btn.removeAttribute('aria-busy'); }
}
async function band(outW, outH, parts, lines, sc, tok) {
  const cv = document.createElement('canvas'), ctx = cv.getContext('2d');
  const k = outW / 1200, pad = 28 * k, font = n => `${n}px 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif`;
  ctx.font = `500 ${font(17 * k)}`;
  const rightW = 330 * k, textW = outW - pad * 3 - rightW;
  const condL = wrapText(ctx, lines.cond, textW), stateL = wrapText(ctx, lines.state, textW);
  const bandH = pad * 2 + 48 * k + (condL.length + stateL.length) * 26 * k;
  cv.width = outW; cv.height = Math.round(outH + bandH);
  ctx.fillStyle = tok('--surface-1'); ctx.fillRect(0, 0, cv.width, cv.height);
  for (const p of parts) ctx.drawImage(p.img, p.x, p.y, p.w, p.h);
  ctx.fillStyle = tok('--line-2'); ctx.fillRect(0, outH, outW, Math.max(1, k));
  let y = outH + pad + 14 * k;
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = tok('--text-2'); ctx.font = `600 ${font(14 * k)}`; ctx.fillText('실험 결과 · 송쌤과학 가상실험실', pad, y);
  y += 30 * k; ctx.fillStyle = tok('--text-1'); ctx.font = `800 ${font(22 * k)}`; ctx.fillText(`${LAB_TITLE} — ${sc.title}`, pad, y);
  ctx.font = `500 ${font(17 * k)}`; ctx.fillStyle = tok('--text-1');
  for (const l of condL) { y += 26 * k; ctx.fillText(l, pad, y); }
  ctx.fillStyle = tok('--text-2');
  for (const l of stateL) { y += 26 * k; ctx.fillText(l, pad, y); }
  const now = new Date(), p2 = n => String(n).padStart(2, '0');
  ctx.textAlign = 'right'; let ry = outH + pad + 30 * k; const rx = outW - pad;
  ctx.fillStyle = tok('--text-2'); ctx.font = `500 ${font(15 * k)}`;
  ctx.fillText(`${now.getFullYear()}-${p2(now.getMonth() + 1)}-${p2(now.getDate())} ${p2(now.getHours())}:${p2(now.getMinutes())}`, rx, ry); ry += 26 * k;
  ctx.fillText('© 송쌤과학 · @songsamscience', rx, ry);
  ctx.textAlign = 'left';
  const blob = await new Promise(ok => cv.toBlob(ok, 'image/png'));
  if (!blob) throw new Error('blob');
  const fname = `${LAB_FILE}_실험결과_${now.getFullYear()}${p2(now.getMonth() + 1)}${p2(now.getDate())}-${p2(now.getHours())}${p2(now.getMinutes())}.png`.replace(/[\\/:*?"<>|\s]/g, '');
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fname; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  window.__lastCapture = { name: fname, w: cv.width, h: cv.height, url: cv.toDataURL('image/png') };
  toast(`실험 결과를 PNG로 저장했어요 — ${fname}`);
}

/* ═════════════ 공기 넣기(누르고 있으면 계속) ═════════════ */
let airTimer = 0;
function clearAir() { clearInterval(airTimer); airTimer = 0; }
function airStart() {
  if (!cur.scene || S.screen !== 'bench') return;
  cur.scene.stroke();
  clearAir();
  airTimer = setInterval(() => { if (!cur.scene || S.screen !== 'bench') return clearAir(); cur.scene.stroke(); }, REDUCED ? 260 : 600);
}

/* ═════════════ 이벤트 ═════════════ */
function bind() {
  document.addEventListener('click', e => {
    const t = e.target.closest('button,a,[data-go]'); if (!t) return;
    if (t.matches('[data-close]')) { const d = t.closest('dialog'); if (d) d.close(); return; }
    if (t.dataset.go) { if ($('#drawer').open) $('#drawer').close(); go(t.dataset.go, { step: t.dataset.step != null ? +t.dataset.step : null }); return; }
    const id = t.id;
    if (id === 'themeBtn') return toggleTheme();
    if (id === 'fullBtn') return toggleFull();
    if (id === 'helpBtn' || id === 'dHelp') { if ($('#drawer').open) $('#drawer').close(); return openHelp(); }
    if (id === 'bookBtn') return openTheory();
    if (id === 'saveBtn') return capture();
    // 풍선 실험
    if (S.screen === 'bench' && cur.scene) {
      if (t.dataset.size) { cur.scene.setD(+t.dataset.size, true); B.pumped = true; return; }
      if (t.closest('#modeSeg')) { B.mode = t.dataset.v; B.pend = null; cur.scene.render(); syncBench(); saveBench(); return; }
      if (id === 'gridTog') { B.grid = !B.grid; cur.scene.render(); syncBench(); saveBench(); return; }
      if (t.dataset.pair) { B.pair = t.dataset.pair.split('-').map(Number); B.pend = null; cur.scene.render(); syncBench(); saveBench(); return; }
      if (t.dataset.ref) { B.ref = +t.dataset.ref; cur.scene.render(); syncBench(); saveBench(); return; }
      if (id === 'recBtn') return record();
      if (id === 'airBtn') { if (e.detail === 0) cur.scene.stroke(); B.pumped = true; return; }
      if (id === 'undoRec') { if (!recs.length) return; const last = recs[recs.length - 1].id.split('-')[0]; recs = recs.filter(r => r.id.split('-')[0] !== last); store.set('recs', recs); renderRecs(); announce('마지막 기록을 지웠어요.'); return; }
      if (id === 'clearRec') { if (!recs.length) return; const n = recs.length; recs = []; foundOnce = false; store.set('recs', recs); renderRecs(); toast(`기록 ${n}개를 지웠어요.`); return; }
      if (id === 'resetBench') { cur.scene.stop(); Object.assign(B, BENCH0(), { pumped: B.pumped }); cur.scene.render(); syncBench(); renderRecs(); saveBench(); announce('처음 조건(지름 12 cm, 줄자 ①–②)으로 돌렸어요. 기록은 그대로예요.'); return; }
    }
    // 우주 팽창
    if (S.screen === 'cosmos' && cur.scene) {
      if (t.dataset.step != null && t.closest('#steps')) { CZ.step = +t.dataset.step; saveCosmos(); buildCosmos(); return; }
      if (id === 'stNext') { CZ.step = Math.min(STEPS.length - 1, CZ.step + 1); saveCosmos(); buildCosmos(); $('#stNext') ? $('#stNext').focus({ preventScroll: true }) : 0; return; }
      if (id === 'stPrev') { CZ.step = Math.max(0, CZ.step - 1); saveCosmos(); buildCosmos(); return; }
      if (id === 'cPlay') { cur.scene.play(.8); return; }
      if (id === 'cBack') { cur.scene.stop(); Object.assign(cur.scene.s, { a: .8, a0: .8, trails: false }); cur.scene.render(); syncCosmos(); return; }
      if (id === 'cgGrid') { const s = cur.scene.s; s.grid = !s.grid; t.setAttribute('aria-pressed', String(s.grid)); cur.scene.render(); return; }
      if (t.closest('#refSeg')) { CZ.ref = t.dataset.v; saveCosmos(); syncSeg('refSeg', CZ.ref); cur.scene.setRef(CZ.ref); return; }
      if (t.dataset.t != null && t.closest('#histChips')) { CZ.t = +t.dataset.t; saveCosmos(); cur.scene.s.t = CZ.t; cur.scene.render(); $('#tRng').value = CZ.t; syncCosmos(); return; }
    }
    // 객관식
    if (t.dataset.opt != null && t.closest('.opts')) return pickOpt(+t.dataset.opt);
    if (id === 'mcqNext') return mcqGo(mcq.cur + 1);
    if (id === 'mcqPrev') return mcqGo(mcq.cur - 1);
    if (id === 'mcqEnd') { mcq.done = true; store.set('mcq', mcq); buildQuiz(); return; }
    if (t.dataset.jump != null) return mcqGo(+t.dataset.jump);
    if (id === 'mcqRetry') { mcq = newMcq(true); store.set('mcq', mcq); buildQuiz(); toast('보기 순서를 섞었어요. 다시 도전!'); return; }
    if (id === 'mcqWrong') { const wrong = mcq.order.filter(qid => mcq.ans[qid] !== MCQ.find(q => q.id === qid).a); const n = newMcq(true); n.order = wrong; mcq = n; store.set('mcq', mcq); buildQuiz(); return; }
    // 탐구 질문
    if (t.dataset.hint) { const h = $(`#hint-${t.dataset.hint}`); h.hidden = !h.hidden; if (!h.hidden) { hints[t.dataset.hint] = true; store.set('hints', hints); } syncCard(t.dataset.hint); return; }
    if (t.dataset.model) return askModel(t.dataset.model);
    if (t.dataset.md || t.dataset.mt != null || t.dataset.mplay || t.dataset.mreset != null) return miniAct(t);
    const fig = t.closest('figure.mini');
    if (fig && t.closest('.seg')) {
      const qid = fig.id.replace('mini-', ''), m = minis[qid]; if (!m) return;
      if (t.closest('.seg').id.startsWith('mref')) { m.state.ref = +t.dataset.v; m.scene.render(); }
      miniResult(qid);
    }
  });
  // 공기 넣기: 누르고 있으면 계속 펌프질
  document.addEventListener('pointerdown', e => { const b = e.target.closest('#airBtn'); if (!b || e.button !== 0) return; airStart(); B.pumped = true; });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => document.addEventListener(ev, e => { if (airTimer && (ev !== 'pointerleave' || e.target.closest && e.target.closest('#airBtn'))) clearAir(); }, true));
  document.addEventListener('input', e => {
    const t = e.target;
    if (t.dataset.ans) { if (locks[t.dataset.ans]) return; answers[t.dataset.ans] = t.value; store.set('answers', answers); syncCard(t.dataset.ans); return; }
    if (t.dataset.rev) { revisions[t.dataset.rev] = t.value; store.set('revisions', revisions); syncCard(t.dataset.rev); return; }
    if (t.id === 'dRng' && cur.scene) { cur.scene.setD(+t.value, false); B.pumped = true; return; }
    if (t.id === 'kRng' && cur.scene) { CZ.k = +t.value; cur.scene.s.k = CZ.k; cur.scene.render(); syncCosmos(); saveCosmos(); return; }
    if (t.id === 'tRng' && cur.scene) { CZ.t = +t.value; cur.scene.s.t = CZ.t; cur.scene.render(); syncCosmos(); saveCosmos(); return; }
    if (t.dataset.mrng) { const m = minis[t.dataset.mrng]; if (m) m.scene.setD(+t.value, false); return; }
    if (t.dataset.mk) { const m = minis[t.dataset.mk]; if (m) m.scene.setK(+t.value, false); return; }
    if (t.dataset.mtr) { const m = minis[t.dataset.mtr]; if (m) { m.state.t = +t.value; m.scene.render(); miniResult(t.dataset.mtr); } return; }
  });
  document.addEventListener('toggle', e => { const d = e.target; if (d.matches && d.matches('details.qcard') && d.open) openMini(d.dataset.q); }, true);
  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const t = e.target;
    if (t.closest && t.closest('textarea,select,[contenteditable="true"],input:not([type=range]):not([type=checkbox]):not([type=radio])')) return;
    if ($('#modal').open && !['Escape'].includes(e.key)) { if (!['f', 'd', 'F', 'D'].includes(e.key)) return; }
    const k = e.key.toLowerCase();
    if (k === 'f') { e.preventDefault(); toggleFull(); }
    else if (k === 'd') { e.preventDefault(); toggleTheme(); }
    else if (k === 'h') { e.preventDefault(); openHelp(); }
    else if (k === 'c' && isLab()) { e.preventDefault(); capture(); }
    else if (S.screen === 'quiz' && /^[1-5]$/.test(e.key) && !mcq.done) {
      const id = mcq.order[mcq.cur]; if (mcq.ans[id] == null) { e.preventDefault(); pickOpt(mcq.perm[id][+e.key - 1]); }
    }
  });
  $$('dialog').forEach(d => d.addEventListener('close', () => {
    const r = d.id === 'drawer' ? drawerReturn : modalReturn;
    if (r && r.isConnected) r.focus({ preventScroll: true });
  }));
  $$('dialog').forEach(d => d.addEventListener('click', e => { if (e.target === d) d.close(); }));
  document.addEventListener('fullscreenchange', syncFull);
  let rt = 0;
  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (cur.scene && cur.scene.fitText) cur.scene.fitText(); Object.values(minis).forEach(m => m.scene && m.scene.fitText && m.scene.fitText()); }, 120); });
