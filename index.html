<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="version" content="1.0">
<meta name="description" content="펌프로 붙임딱지를 붙인 풍선을 불며 줄자로 거리를 재고, 풍선 모형으로 외부 은하가 멀어지는 까닭과 중심 없는 우주 팽창, 대폭발 이후 우주의 과거를 알아보는 중학교 과학 가상실험실">
<meta property="og:title" content="송쌤과학 가상실험실 | 우주 팽창">
<meta property="og:description" content="풍선을 불면 붙임딱지는 그대로인데 거리만 늘어난다 — 풍선 모형으로 우주가 팽창하고 있음을 설명해요">
<meta name="theme-color" id="metaTheme" content="#101b28">
<title>송쌤과학 가상실험실 | 우주 팽창</title>

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script>(function(){try{var t=localStorage.getItem('ssv-theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(e){}})();</script>
<style>
/* ① 테마와 무관한 토큰 */
:root{
  --font-ui:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-title:var(--font-ui);
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-8:32px;
  --r-1:6px;--r-2:10px;--r-3:16px;--r-full:999px;       /* 작은 컨트롤 6 · 버튼·입력 10 · 패널·장면 16 · 상태 알약 full */
  --control-h:34px;--icon-size:18px;
  --dur-fast:140ms;--dur-ui:260ms;--dur-ui-out:180ms;--dur-layout:360ms;
  --ease-out:cubic-bezier(.2,0,0,1);--ease-in:cubic-bezier(.4,0,1,1);--lift:8px;
  --top-h:56px;--rail-w:84px;--panel-w:clamp(380px,31vw,450px);
  --light-angle:215deg;                                  /* 주 광원: 왼쪽 위 (UI 그림자는 아래로, 풍선 반사는 왼쪽 위) */
  --brand-pink:#FFB7B2;--brand-ink:#3b1d1b;
  --yt-red:#ff0033;--yt-play:#ffffff;--ig-1:#feda75;--ig-2:#fa7e1e;--ig-3:#d62976;--ig-4:#4f5bd5;
  /* 장면(실험대·우주): 두 테마 모두 어두운 채로 남으므로 테마와 무관한 토큰만 쓴다 (§11-8) */
  --st-bg-0:#070b13;--st-bg-1:#0d1421;--st-text-1:#e9eef5;--st-text-2:#b4c1cf;--st-line:#3a4a63;--st-accent:#7fe0cf;--st-chip-bg:#0a1220;--st-chip-line:#3a4a63;--st-white:#ffffff;--st-shadow:#000000;
  --st-wall-0:#111a27;--st-wall-1:#0a1019;--st-table-back:#141c27;--st-table-top:#1d2632;--st-table-front:#0c1118;--st-table-edge:#2f3b4c;
  --st-rubber-hi:#ddd3ff;--st-rubber:#7b61ff;--st-rubber-lo:#35208f;--st-rubber-rim:#291873;--st-rubber-thin:#c7baff;--st-rubber-neck:#1e1158;
  --st-sticker:#ffb347;--st-sticker-rim:#ffd79c;--st-sticker-edge:#b8741a;--st-sticker-ink:#2a1a05;
  --st-tape:#f3eee2;--st-tape-edge:#b9ae94;--st-tape-ink:#23262d;--st-tape-tip:#c9d1da;--st-read:#ff5d73;
  --st-grid:#6fe0cf;--st-pen:#1a0f33;
  --st-pump-hi:#ffe68a;--st-pump:#f0c02a;--st-pump-lo:#a97a07;--st-pump-cap:#c9950c;--st-pump-ink:#4a3500;--st-grip:#262b33;--st-grip-lift:#39414d;--st-grip-ridge:#4a525e;
  --st-metal-hi:#dfe5ec;--st-metal-mid:#8d98a5;--st-metal-lo:#3b4450;
  --st-space-0:#03060d;--st-space-1:#0c1628;--st-gx-core:#fff4d6;--st-gx-arm:#b8c7ff;--st-gx-halo:#7d95ff;--st-gx-ell:#ffd49a;--st-gx-bar:#ffe3b0;
  --st-bang:#fff1c9;--st-bang-glow:#ff9d4d;--st-trail:#c9d4e2;
  --st-dough-hi:#f7e2bb;--st-dough:#e3bc82;--st-crust:#a8652a;--st-raisin:#3a1c2a;--st-raisin-hi:#8a5870;--st-tray:#6f7a87;--st-tray-top:#a9b3bf;
}
/* ② 테마 토큰 — 두 블록은 같은 목록, 값만 다르다 (시리즈 참고 팔레트 · UI 크롬) */
:root[data-theme="dark"]{
  color-scheme:dark;
  --surface-0:#0b131d;--surface-1:#101b28;--surface-2:#182636;
  --text-1:#e8eff5;--text-2:#b0c0cf;--text-3:#8ea2b4;--line-1:#223445;--line-2:#34495d;
  --accent:#6fd3c1;--accent-strong:#9be7d9;--accent-soft:#163a3b;--on-accent:#08131c;--focus:#9be7d9;--scrim:#02070dcc;
  --danger:#ff9d8a;--danger-soft:#3b2322;--ok:#7ed7a0;--ok-soft:#1d3b32;--warn:#ffcf5c;--warn-soft:#3f3822;
  --data-1:#E69F00;--data-2:#56B4E9;--data-3:#2fbf92;--data-4:#CC79A7;--data-now:#e8eff5;
  --shadow-color:215 45% 3%;
  --shadow-1:0 0 #0000;
  --shadow-2:0 12px 32px -12px hsl(var(--shadow-color) / .6);
  --shadow-3:0 24px 64px -16px hsl(var(--shadow-color) / .7);
  --edge-hi:inset 0 1px 0 hsl(0 0% 100% / .06);
}
:root[data-theme="light"]{
  color-scheme:light;
  --surface-0:#edf1f4;--surface-1:#fbfcfd;--surface-2:#e3eaf0;
  --text-1:#132a3b;--text-2:#44596b;--text-3:#566b7e;--line-1:#d3dde5;--line-2:#b2c3d0;
  --accent:#0f6b60;--accent-strong:#0a5148;--accent-soft:#d5eeea;--on-accent:#ffffff;--focus:#0a5148;--scrim:#0b1a2680;
  --danger:#b3261e;--danger-soft:#fbe3df;--ok:#1d7a47;--ok-soft:#d8f0e2;--warn:#8a5a00;--warn-soft:#fff2c8;
  --data-1:#B07400;--data-2:#0072B2;--data-3:#007A5A;--data-4:#A6508A;--data-now:#132a3b;
  --shadow-color:210 30% 22%;
  --shadow-1:0 1px 2px hsl(var(--shadow-color) / .08);
  --shadow-2:0 1px 2px hsl(var(--shadow-color) / .06),0 10px 28px -10px hsl(var(--shadow-color) / .22);
  --shadow-3:0 2px 6px hsl(var(--shadow-color) / .08),0 24px 56px -16px hsl(var(--shadow-color) / .30);
  --edge-hi:0 0 #0000;
}
/* ③ 기본 마감 */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;accent-color:var(--accent)}
body{margin:0;background:var(--surface-0);color:var(--text-1);font:400 15px/1.65 var(--font-ui);font-synthesis:none;word-break:keep-all;overflow-wrap:break-word}
:root[data-theme="dark"] body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
h1,h2,h3,h4{text-wrap:balance;margin:0}
p,li,figcaption{text-wrap:pretty}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:max(16px,1em)}
button,a,[role="button"]{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
::selection{background:color-mix(in oklab,var(--accent) 30%,transparent)}
input,textarea{caret-color:var(--accent)}
*{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.scroll{overflow:auto;overscroll-behavior:contain;scrollbar-gutter:stable}
.num{font-variant-numeric:tabular-nums}
.unit{white-space:nowrap}
img,canvas,video{display:block;max-width:100%}
[hidden]{display:none!important}
dialog:not([open]){display:none}
[popover]:not(:popover-open){display:none}
.sr-only{position:absolute;left:0;top:0;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;z-index:90;padding:8px 12px;border-radius:var(--r-1);background:var(--accent);color:var(--on-accent);text-decoration:none;font-weight:600}
.skip:focus{top:8px}
kbd{font:600 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:3px 5px;color:var(--text-1);background:var(--surface-0)}
svg.ic{width:var(--icon-size);height:var(--icon-size);fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--text-2)}.small{font-size:13px}
.sub{color:var(--text-2)}
.warn-t{color:var(--warn);font-weight:600}
:root[data-theme="light"] .warn-t{color:var(--warn)}

/* 상단 막대 */
body{height:100dvh;display:grid;grid-template-rows:var(--top-h) minmax(0,1fr);overflow:hidden}
.topbar{position:relative;z-index:30;height:var(--top-h);display:flex;align-items:center;gap:12px;padding:0 12px 0 16px;background:var(--surface-1);border-bottom:1px solid var(--line-1)}
.brand{display:flex;align-items:center;gap:8px;white-space:nowrap;flex:none}
.brandmark{width:27px;height:27px;border-radius:var(--r-2);background:var(--brand-pink);color:var(--brand-ink);display:grid;place-items:center;flex:none}
.brandmark svg.ic{width:17px;height:17px;stroke-width:2}
.word{font:700 13px/1 var(--font-ui);color:var(--text-1)}
.vdiv{width:1px;height:15px;background:var(--line-2);flex:none}
.social{position:relative;width:34px;height:34px;display:grid;place-items:center;border-radius:var(--r-1);color:var(--text-2);text-decoration:none}
.social::before{content:'';position:absolute;inset:-5px}
.social svg{width:21px;height:21px}
.social .yt-body{fill:currentColor}.social .yt-play{fill:var(--surface-1)}
.social .ig-line{fill:none;stroke:currentColor;stroke-width:2}.social .ig-dot{fill:currentColor}
.social:is(:hover,:focus-visible) .yt-body{fill:var(--yt-red)}.social:is(:hover,:focus-visible) .yt-play{fill:var(--yt-play)}
.social:is(:hover,:focus-visible) .ig-line{stroke:url(#ig-grad)}.social:is(:hover,:focus-visible) .ig-dot{fill:var(--ig-3)}
.top-title{display:flex;align-items:center;gap:10px;min-width:0;font:700 15px/1.2 var(--font-ui);color:var(--text-1)}
.top-title .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-title .std{font:600 12px/1 var(--font-ui);color:var(--text-2);white-space:nowrap}
.utilities{margin-left:auto;display:flex;align-items:center;gap:2px;flex:none}
.hsep{width:1px;height:20px;background:var(--line-1);margin:0 4px}
.icon-btn{position:relative;width:36px;height:36px;display:grid;place-items:center;border:0;border-radius:var(--r-2);background:transparent;color:var(--text-2);cursor:pointer;transition:background var(--dur-fast),color var(--dur-fast),transform var(--dur-fast)}
.icon-btn::before{content:'';position:absolute;inset:-4px}
.icon-btn svg.ic{width:20px;height:20px}
.icon-btn:active{transform:scale(.94)}
@media (hover:hover) and (pointer:fine){.icon-btn:hover,.social:hover{background:var(--surface-2);color:var(--text-1)}}

/* 앱 골격: 좌측 레일 + 본문 */
.appbody{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);min-height:0}
.rail{display:flex;flex-direction:column;gap:4px;padding:12px 8px;background:var(--surface-1);border-right:1px solid var(--line-1);overflow-y:auto}
.rail button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:68px;padding:8px 2px;border:0;border-radius:var(--r-2);background:transparent;color:var(--text-2);font:600 12px/1.25 var(--font-ui);text-align:center;cursor:pointer}
.rail button svg.ic{width:23px;height:23px;stroke-width:1.7}
.rail button .s{display:none}
.rail button[aria-current="page"]{background:var(--surface-2);color:var(--text-1);font-weight:800}
.rail button[aria-current="page"]::after{content:'';position:absolute;left:-8px;top:16px;bottom:16px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
@media (hover:hover) and (pointer:fine){.rail button:hover{color:var(--text-1)}}
main{position:relative;overflow:auto;padding:12px 16px 14px;min-width:0;min-height:0;outline:none}

/* 실험 화면 */
.lab{display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px;height:100%;min-height:0}
.lab-head{display:flex;align-items:center;gap:6px 14px;min-height:34px;flex-wrap:wrap}
.lab-head h1{font:800 18px/1.3 var(--font-title);letter-spacing:-.02em}
.goal{margin:0;font-size:13px;line-height:1.45;color:var(--text-2);font-weight:500}
.head-seg{margin-left:auto}
.lab-grid{display:grid;grid-template-columns:minmax(0,1fr) var(--panel-w);gap:14px;min-height:0}
.bench{display:flex;flex-direction:column;min-height:0;min-width:0;border:1px solid var(--line-1);border-radius:var(--r-3);background:var(--surface-1);overflow:hidden}
.bench-head{display:flex;align-items:center;gap:8px;padding:7px 8px 7px 10px;border-bottom:1px solid var(--line-1);background:var(--surface-1)}
.bh-tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0;flex:1}
.bh-k{font:600 13px/1 var(--font-ui);color:var(--text-2);margin-right:2px}
.bh-sep{width:1px;height:20px;background:var(--line-1);margin:0 4px}
.stage{position:relative;flex:1;min-height:0;background:var(--st-bg-1);touch-action:pan-y}
.stage>svg{position:absolute;inset:0;width:100%;height:100%}
.status{margin:0;padding:10px 14px;min-height:60px;border-top:1px solid var(--line-1);background:var(--surface-1);font-size:15px;line-height:1.55;color:var(--text-1)}
.status b{font-weight:800}
.panel{display:flex;flex-direction:column;min-height:0;min-width:0;border:1px solid var(--line-1);border-radius:var(--r-3);background:var(--surface-1);overflow:hidden}
.panel-scroll{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:12px 14px 14px;display:flex;flex-direction:column}
.panel-foot{border-top:1px solid var(--line-1);padding:8px 10px;background:var(--surface-1);display:flex;gap:6px;flex-wrap:wrap}
.pg{flex:none}
.pg+.pg{margin-top:12px;padding-top:12px;border-top:1px solid var(--line-1)}
.pg-title{font:700 13px/1.3 var(--font-ui);color:var(--text-2);margin:0 0 8px;display:flex;align-items:center;gap:8px}
.pg-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.pg-row .pg-title{margin:0}
.pg-k{display:block;font:600 12px/1.3 var(--font-ui);color:var(--text-2);margin-bottom:5px}
.count,.pill{font:700 12px/1 var(--font-ui);color:var(--text-2);padding:3px 7px;border:1px solid var(--line-2);border-radius:var(--r-full)}
.help{margin:6px 0 0;font-size:13px;line-height:1.6;color:var(--text-2)}
.empty{margin:4px 0 0;font-size:13px;line-height:1.6;color:var(--text-2)}
.shutter{position:absolute;inset:0;background:var(--st-text-1);opacity:0;pointer-events:none;animation:shutter .32s ease-out;z-index:8}
@keyframes shutter{0%{opacity:.5}100%{opacity:0}}

/* 컨트롤 */
.tool{position:relative;display:inline-flex;align-items:center;gap:6px;height:var(--control-h);padding:0 11px;border:1px solid var(--line-2);border-radius:var(--r-1);background:var(--surface-1);color:var(--text-1);font:600 13px/1 var(--font-ui);white-space:nowrap;cursor:pointer;transition:background var(--dur-fast),border-color var(--dur-fast),transform var(--dur-fast)}
.tool::before{content:'';position:absolute;inset:-5px -2px}
.tool svg.ic{width:17px;height:17px}
.tool[aria-pressed="true"]{background:var(--surface-2);border-color:var(--text-2);font-weight:800}
.tool[aria-pressed="true"] svg.ic{color:var(--accent)}
.tool.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:800}
.tool.ghost{border-color:transparent;background:transparent;color:var(--text-2)}
.tool.save{margin-left:auto;border-color:transparent;background:transparent;color:var(--text-2);flex:none}
.tool:disabled{opacity:.45;cursor:not-allowed}
.tool[aria-busy="true"]{opacity:.6;cursor:progress}
.tool:active:not(:disabled){transform:scale(.96)}
@media (hover:hover) and (pointer:fine){.tool:hover:not(:disabled):not(.primary){background:var(--surface-2);color:var(--text-1)}.tool.primary:hover{filter:brightness(1.06)}}
.seg{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--line-2);border-radius:var(--r-2);background:var(--surface-0)}
.seg button{position:relative;min-height:30px;padding:0 10px;border:0;border-radius:7px;background:transparent;color:var(--text-2);font:600 13px/1 var(--font-ui);white-space:nowrap;cursor:pointer}
.seg button::before{content:'';position:absolute;inset:-6px -1px}
.seg button small{font-weight:500;font-size:12px;color:inherit;opacity:.85;margin-left:2px}
.seg button[aria-pressed="true"]{background:var(--surface-1);color:var(--text-1);font-weight:800;box-shadow:var(--shadow-1),inset 0 -2px 0 var(--accent)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.seg.tiny button{min-height:28px;padding:0 8px;font-size:12px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{position:relative;min-width:44px;height:30px;padding:0 9px;border:1px solid var(--line-2);border-radius:var(--r-full);background:transparent;color:var(--text-1);font:700 13px/1 var(--font-ui);font-variant-numeric:tabular-nums;cursor:pointer;transition:background var(--dur-fast),border-color var(--dur-fast)}
.chip::before{content:'';position:absolute;inset:-7px -1px}
.chip .u{font-weight:500;font-size:12px;color:var(--text-2);margin-left:2px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--text-1)}
@media (hover:hover) and (pointer:fine){.chip:hover{background:var(--surface-2)}}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:0 13px;border:1px solid var(--line-2);border-radius:var(--r-2);background:var(--surface-1);color:var(--text-1);font:600 13px/1.2 var(--font-ui);white-space:nowrap;cursor:pointer;text-decoration:none;transition:background var(--dur-fast),transform var(--dur-fast)}
.btn::before{content:'';position:absolute;inset:-3px 0}
.btn svg.ic{width:17px;height:17px}
.btn.primary{min-height:42px;background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:800}
.btn.ghost{border-color:transparent;background:transparent;color:var(--text-2)}
.btn.small{min-height:34px;padding:0 10px}
.btn.small::before{inset:-5px 0}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:active:not(:disabled){transform:scale(.98)}
@media (hover:hover) and (pointer:fine){.btn:hover:not(:disabled):not(.primary){background:var(--surface-2);color:var(--text-1)}.btn.primary:hover:not(:disabled){filter:brightness(1.06)}}
.mini-tog{position:relative;display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 9px;border:1px solid var(--line-2);border-radius:var(--r-full);background:transparent;color:var(--text-2);font:600 12px/1 var(--font-ui);cursor:pointer}
.mini-tog::before{content:'';position:absolute;inset:-8px -2px}
.mini-tog svg.ic{width:15px;height:15px}
.mini-tog[aria-pressed="true"]{border-color:var(--accent);color:var(--text-1);background:var(--accent-soft)}
.xbtn{position:relative;width:28px;height:28px;display:inline-grid;place-items:center;border:0;border-radius:var(--r-1);background:transparent;color:var(--text-2);cursor:pointer}
.xbtn::before{content:'';position:absolute;inset:-8px -2px}
.xbtn svg.ic{width:15px;height:15px}
.xbtn.big{width:36px;height:36px;border:1px solid var(--line-2)}

@media (hover:hover) and (pointer:fine){.xbtn:hover{background:var(--surface-2);color:var(--text-1)}}
.linkbtn{position:relative;display:inline-flex;align-items:center;gap:4px;min-height:30px;padding:0 6px;border:0;border-radius:var(--r-1);background:transparent;color:var(--text-2);font:600 12px/1 var(--font-ui);cursor:pointer}
.linkbtn::before{content:'';position:absolute;inset:-7px -2px}
.linkbtn svg.ic{width:15px;height:15px}
.linkbtn:disabled{opacity:.4;cursor:not-allowed}
input[type=range]{width:100%;min-height:30px;cursor:pointer}

/* 측정 칸 */
.cond{display:flex;gap:12px;flex-wrap:wrap}

.meas{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.read{display:flex;flex-direction:column;min-width:0}
.read-k{font:600 13px/1.3 var(--font-ui);color:var(--text-2)}
.read-k b{color:var(--text-1);font-weight:800}
.read-big{display:flex;align-items:baseline;gap:6px}
.read-big b{font:800 28px/1.1 var(--font-ui);letter-spacing:-.01em;min-width:3.4ch}
.read-u{font:600 15px/1 var(--font-ui);color:var(--text-2)}
.steady{display:inline-flex;align-items:center;gap:4px;font:700 12px/1 var(--font-ui);color:var(--ok)}
.steady svg.ic{width:14px;height:14px}
.expo{display:inline-flex;align-items:center;gap:8px;margin-left:4px;font:600 13px/1 var(--font-ui);color:var(--text-2)}
.expo input{width:150px}
.dist-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:8px}
.dist .chips{margin-top:2px}
.meas .cond-cell{align-items:flex-end}
.read-k .steady{margin:0 0 0 6px;vertical-align:middle}
.stepper{display:flex;align-items:center;gap:6px}
.stepper input{width:72px;height:36px;padding:0 8px;border:1px solid var(--line-2);border-radius:var(--r-1);background:var(--surface-0);text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.stepper .u{font-size:13px;color:var(--text-2)}
.recs{display:flex;flex-direction:column;flex:1 1 auto;min-height:112px}
.lab-camera .recs{min-height:90px}.lab-camera .rec-wrap{min-height:66px}
.rec-wrap{flex:1 1 0;min-height:96px;overflow:auto}
.rec{width:100%;border-collapse:collapse;font-size:13px}
.rec th{position:sticky;top:0;background:var(--surface-1);padding:4px 6px;border-bottom:1px solid var(--line-2);font:600 12px/1.3 var(--font-ui);color:var(--text-2);text-align:left;white-space:nowrap;z-index:1}
.rec th.num,.rec td.num{text-align:right}
.rec td{padding:5px 6px;border-bottom:1px solid var(--line-1);font-variant-numeric:tabular-nums;vertical-align:middle;white-space:nowrap}
.rec td b{font-weight:800}
.rec tr.fresh td{background:var(--accent-soft);transition:background 1.2s}
.rec .x{width:32px;padding:0;text-align:right}
.rec .muted{color:var(--text-2)}
.ctag{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--text-2)}
.ctag .mk{width:9px;height:9px;border-radius:50%;background:var(--data-1)}
.ctag .mk.s2{background:var(--data-2);border-radius:1px}.ctag .mk.s3{background:var(--data-3);border-radius:0;clip-path:polygon(50% 0,100% 100%,0 100%)}.ctag .mk.s4{background:var(--data-4);border-radius:0;transform:rotate(45deg) scale(.85)}
.flag{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--danger);color:var(--surface-1);font:800 11px/1 var(--font-ui)}
.flag.soft{background:var(--surface-2);color:var(--text-2);border:1px solid var(--line-2)}
.graph .g-svg{width:100%;height:auto;display:block}
.g-grid{stroke:var(--line-1);stroke-width:1}
.g-axis{stroke:var(--text-2);stroke-width:1.2}
.g-yt,.g-xt{font:500 11px var(--font-ui);fill:var(--text-2);font-variant-numeric:tabular-nums}
.g-yt{text-anchor:end}.g-xt{text-anchor:middle}
.g-lab{font:600 11px var(--font-ui);fill:var(--text-2);text-anchor:middle}
.g-lab.start{text-anchor:start}
.g-pt{stroke:var(--surface-1);stroke-width:1.5}
.g-pt.s1{fill:var(--data-1)}.g-pt.s2{fill:var(--data-2)}.g-pt.s3{fill:var(--data-3)}.g-pt.s4{fill:var(--data-4)}
.g-curve{fill:none;stroke-width:1.8;stroke-dasharray:5 4;opacity:.9}
.g-curve.s1{stroke:var(--data-1)}.g-curve.s2{stroke:var(--data-2)}.g-curve.s3{stroke:var(--data-3)}.g-curve.s4{stroke:var(--data-4)}
.g-now{stroke:var(--text-2);stroke-width:1;stroke-dasharray:2 3}
.g-now-pt{fill:none;stroke:var(--data-now);stroke-width:2}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px;font:500 12px/1.4 var(--font-ui);color:var(--text-2)}
.lg{display:inline-flex;align-items:center;gap:5px}
.lg svg{width:14px;height:14px;overflow:visible}
.lg svg[viewBox^="0"]{width:18px;height:8px}
.lg.muted{font-style:normal}

/* ── 장면 SVG 공통 ── */
.scene-svg text,.stage-fig text{font-family:var(--font-ui)}
svg text[text-anchor="start"]{text-anchor:start}svg text[text-anchor="end"]{text-anchor:end}svg text[text-anchor="middle"]{text-anchor:middle}
.scene-svg .hit,.stage-fig .hit{fill:transparent}
.focus-ring{fill:none;stroke:var(--st-accent);stroke-width:2.5;stroke-dasharray:6 4;opacity:0;pointer-events:none}
g:focus-visible>.focus-ring{opacity:1}
g:focus{outline:none}
.st-white{stop-color:var(--st-white)}.st-metal-hi{stop-color:var(--st-metal-hi)}.st-metal-mid{stop-color:var(--st-metal-mid)}.st-metal-lo{stop-color:var(--st-metal-lo)}
.st-wall-0{stop-color:var(--st-wall-0)}.st-wall-1{stop-color:var(--st-wall-1)}.st-table-back{stop-color:var(--st-table-back)}.st-table-top{stop-color:var(--st-table-top)}
.st-rub-hi{stop-color:var(--st-rubber-hi)}.st-rub{stop-color:var(--st-rubber)}.st-rub-lo{stop-color:var(--st-rubber-lo)}
.st-pump-hi{stop-color:var(--st-pump-hi)}.st-pump{stop-color:var(--st-pump)}.st-pump-lo{stop-color:var(--st-pump-lo)}
.st-space-0{stop-color:var(--st-space-0)}.st-space-1{stop-color:var(--st-space-1)}.st-gx-core{stop-color:var(--st-gx-core)}.st-gx-halo{stop-color:var(--st-gx-halo)}.st-gx-ell{stop-color:var(--st-gx-ell)}
.st-bang{stop-color:var(--st-bang)}.st-bang-glow{stop-color:var(--st-bang-glow)}.st-dough-hi{stop-color:var(--st-dough-hi)}.st-dough{stop-color:var(--st-dough)}
.shadow{fill:var(--st-shadow);opacity:.42}
/* 실험대 */
.tbl-front{fill:var(--st-table-front)}
.tbl-edge{fill:none;stroke:var(--st-table-edge);stroke-width:2}
.pump-cap{fill:var(--st-pump-cap)}
.pump-shine{fill:none;stroke:var(--st-pump-hi);stroke-width:3;stroke-linecap:round;opacity:.75}
.pump-lbl{font-size:max(12px,calc(var(--px,1) * 12px));font-weight:800;fill:var(--st-pump-ink);text-anchor:middle;letter-spacing:.02em}
.pump-rod{fill:var(--st-metal-mid)}
.pump-grip{fill:var(--st-grip)}
.pump-ridge{fill:none;stroke:var(--st-grip-ridge);stroke-width:2;stroke-linecap:round}
.grip-g{cursor:grab;touch-action:none}
.grip-g.lift{cursor:grabbing}
.grip-g.lift .pump-grip{fill:var(--st-grip-lift)}
.dragging{cursor:grabbing}
.rub-thin{fill:var(--st-rubber-thin);pointer-events:none}
.st-neck{stop-color:var(--st-rubber-neck)}
.rub-lip{fill:var(--st-rubber-lo);stroke:var(--st-rubber-rim);stroke-width:1}
.rub-knot{fill:var(--st-rubber-lo);stroke:var(--st-rubber-rim);stroke-width:1}
.rub-rim{fill:none;stroke:var(--st-rubber-rim);stroke-width:1.2;opacity:.85}
.rub-spec{pointer-events:none}
.mgrid{fill:none;stroke:var(--st-grid);opacity:.66;stroke-linecap:round;stroke-linejoin:round}
.air{fill:none;stroke:var(--st-white);stroke-width:1.6;opacity:.85;stroke-linecap:round;stroke-linejoin:round}
.stk-body{fill:var(--st-sticker);stroke:var(--st-sticker-edge);stroke-width:.8}
.stk-rim{fill:none;stroke:var(--st-sticker-rim);stroke-width:.8;opacity:.6}
.stk-hi{fill:none;stroke:var(--st-white);stroke-width:1.6;stroke-linecap:round;opacity:.55}
.stk-n{font-size:12.5px;font-weight:800;fill:var(--st-sticker-ink);text-anchor:middle}
.stk-ring{fill:none;stroke:var(--st-tape);stroke-width:2.4}
.stk.pend .stk-ring{stroke-dasharray:4 3}
.stk-hit{cursor:pointer;outline:none}
.tape{fill:var(--st-tape);stroke:var(--st-tape-edge);stroke-width:.6}
.tape-tip{fill:var(--st-tape-tip)}
.tape-tick{fill:none;stroke:var(--st-tape-ink)}
.tape-num{font-weight:700;fill:var(--st-tape-ink);text-anchor:middle;font-variant-numeric:tabular-nums}
.tape-lead{fill:none;stroke:var(--st-tape);stroke-dasharray:3 2.5;opacity:.9}
.tape-read{fill:none;stroke:var(--st-read);stroke-linecap:round}
.spoke{fill:none;stroke:var(--st-tape);stroke-linecap:round;opacity:.95}
.pill-lead{fill:none;stroke:var(--st-tape);opacity:.7}
.spill rect{fill:var(--st-chip-bg);stroke:var(--st-chip-line);stroke-width:1}
.spill text{fill:var(--st-text-1);font-weight:800;text-anchor:middle;font-variant-numeric:tabular-nums}
.spill.tag rect{stroke:var(--st-tape);stroke-width:1.4}
.spill.spk rect{fill:var(--st-tape);stroke:none}
.spill.spk text{fill:var(--st-tape-ink)}
.spill.ref rect{stroke:var(--st-accent);stroke-width:1.6}
.spill.mw rect{stroke:var(--st-gx-arm)}
.spill.val rect{stroke:var(--st-text-2)}
.dim-l{fill:none;stroke:var(--st-text-2)}
.dim-t{font-weight:700;fill:var(--st-text-1);text-anchor:middle;font-variant-numeric:tabular-nums;paint-order:stroke;stroke:var(--st-wall-0);stroke-width:calc(var(--px,1) * 4px);stroke-linejoin:round}
.lg-t{font-weight:800;fill:var(--st-text-1)}
.lg-s{font-weight:500;fill:var(--st-text-2)}
.lg-stk{fill:var(--st-sticker)}.lg-stk-n{font-weight:800;fill:var(--st-sticker-ink);text-anchor:middle}
.lg-tape{fill:var(--st-tape)}.lg-tick{stroke:var(--st-tape-ink);stroke-width:1.2}
.lg-grid{fill:none;stroke:var(--st-grid);stroke-width:1.6}
.coach rect{fill:var(--st-accent)}
.coach text{font-weight:800;fill:var(--st-bg-0)}
/* 우주 */
.gx-arm{fill:none;stroke:var(--st-gx-arm);stroke-width:3.2;stroke-linecap:round;opacity:.26}
.gx-bar{fill:var(--st-gx-bar)}
.gx-l use{cursor:pointer}
.cgrid{fill:none;stroke:var(--st-grid);stroke-width:1.1;opacity:.26}
.trail{fill:none;stroke:var(--st-trail);stroke-width:1.8;opacity:.9}
.trail-head{fill:var(--st-trail)}
.trail-o{fill:none;stroke:var(--st-trail);stroke-width:1.2;stroke-dasharray:2 2;opacity:.75}
.ref-ring{fill:none;stroke:var(--st-accent);stroke-width:2.4;stroke-dasharray:5 4}
.tag-ring{fill:none;stroke:var(--st-tape);stroke-width:2}
.h-big{font-size:max(26px,calc(var(--px,1) * 17px));font-weight:800;fill:var(--st-text-1);paint-order:stroke;stroke:var(--st-space-0);stroke-width:5px;stroke-linejoin:round}
.h-sub{font-size:max(17px,calc(var(--px,1) * 13px));font-weight:600;fill:var(--st-text-2);font-variant-numeric:tabular-nums;paint-order:stroke;stroke:var(--st-space-0);stroke-width:4px;stroke-linejoin:round}
.h-big.small{font-size:19px}.h-sub.small{font-size:14px}
.fig-note{font-size:max(14px,calc(var(--px,1) * 11px));font-weight:500;fill:var(--st-text-2);paint-order:stroke;stroke:var(--st-space-0);stroke-width:4px;stroke-linejoin:round}
.uni-disc{fill:var(--st-space-1)}
.uni-rim{fill:none;stroke:var(--st-line);stroke-width:1.5}
.gx-n{font-size:max(15px,calc(var(--px,1) * 12px));font-weight:800;fill:var(--st-text-1);paint-order:stroke;stroke:var(--st-space-0);stroke-width:3px}
.fig-h{font-size:max(20px,calc(var(--px,1) * 14px));font-weight:800;fill:var(--st-text-1);text-anchor:middle}
.map-l{font-size:max(16px,calc(var(--px,1) * 12px));font-weight:700;fill:var(--st-text-1);text-anchor:end}
.map-r{font-size:max(16px,calc(var(--px,1) * 12px));font-weight:700;fill:var(--st-text-1);text-anchor:start}
.map-a{fill:none;stroke:var(--st-text-2);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.t-axis{stroke:var(--st-text-2);stroke-width:2}
.t-head{fill:var(--st-text-2)}
.t-tick{stroke:var(--st-text-2);stroke-width:1.6}
.t-lab{font-size:max(15px,calc(var(--px,1) * 11.5px));font-weight:600;fill:var(--st-text-2);text-anchor:middle}
.t-cap{font-size:max(15px,calc(var(--px,1) * 11.5px));font-weight:700;fill:var(--st-text-2);text-anchor:middle}
.h-ghost{fill:none;stroke:var(--st-text-2);stroke-width:1.4;stroke-dasharray:4 4;opacity:.55}
.h-gdot{fill:var(--st-text-2);opacity:.4}
.h-now{fill:var(--st-space-1)}
.h-rim{fill:none;stroke:var(--st-accent);stroke-width:2}
.h-mark{fill:var(--st-accent)}
/* 건포도 빵 */
.dough{stroke:none}
.crust{fill:none;stroke:var(--st-crust);stroke-width:5;stroke-linecap:round}
.raisin{fill:var(--st-raisin)}
.raisin-hi{fill:var(--st-raisin-hi);opacity:.7}
.raisin-k{font-size:15px;font-weight:800;fill:var(--st-sticker-ink);text-anchor:middle;paint-order:stroke;stroke:var(--st-dough-hi);stroke-width:3px;stroke-linejoin:round}
.tray{fill:var(--st-tray)}.tray-top{fill:var(--st-tray-top)}
.bm-line{fill:none;stroke:var(--st-sticker-ink);stroke-width:1.6}
.spoke.dark{stroke:var(--st-sticker-ink);stroke-width:1;stroke-dasharray:3 3;opacity:.6}
/* 문항·원리 카드 그림 */
.stage-fig{display:block;width:100%;height:auto}
.fig-bg{fill:var(--st-bg-1)}
.fig-t{font-size:20px;font-weight:800;fill:var(--st-text-1)}
.fig-s{font-size:16px;font-weight:600;fill:var(--st-text-2);text-anchor:middle}
.stage-fig .lead{fill:none;stroke:var(--st-text-2);stroke-width:1.4}
.pen-dot{fill:var(--st-pen)}
.fig-div{stroke:var(--st-line);stroke-width:1.5}
.hist-fig .t-lab,.hist-fig .t-cap{font-size:26px}
.hist-fig .fig-note{font-size:22px}

/* 붙임딱지 번호 배지(장면의 붙임딱지와 같은 얼굴) */
.nb{display:inline-grid;place-items:center;width:1.45em;height:1.45em;margin:0 1px;border-radius:50%;background:var(--st-sticker);box-shadow:inset 0 0 0 1px var(--st-sticker-edge);color:var(--st-sticker-ink);font-weight:800;font-size:.82em;line-height:1;font-variant-numeric:tabular-nums;vertical-align:.08em}
.nbp{white-space:nowrap}
.chip.nbchip{font-size:14px}
.read-k .nb{font-size:12px}
/* 풍선 실험 측정 칸 */
.lab-bench .meas{align-items:flex-end}
.lab-bench .pg+.pg{margin-top:10px;padding-top:10px}
.lab-bench .read-big b{min-width:3.2ch}
.all-list{margin:10px 0 0;padding:8px 10px;border-radius:var(--r-2);background:var(--surface-2);font-size:13px;line-height:1.8;color:var(--text-2)}
.all-list .k{font-weight:700;color:var(--text-1);margin-right:4px}
.all-list .it{display:inline-block;margin-right:10px;white-space:nowrap}
.all-list b{color:var(--text-1);font-weight:800}
.chip.wide{padding:0 11px}
.rng-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px}
.proc{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:4px;font-size:13px;line-height:1.4;color:var(--text-2)}
.proc li{display:flex;align-items:center;gap:8px}
.pk{width:20px;height:20px;flex:none;display:grid;place-items:center;border:1.5px solid var(--line-2);border-radius:50%;font:700 11px/1 var(--font-ui);font-variant-numeric:tabular-nums}
.pk svg.ic{width:13px;height:13px;stroke-width:2.4}
.proc li.ok{color:var(--text-1)}
.proc li.ok .pk{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.lab-bench .recs{flex:1 1 auto;display:flex;flex-direction:column;min-height:150px}
.lab-bench .rec-wrap{flex:1 1 0;min-height:80px;overflow:auto}
.rec caption{caption-side:top}
.rec th[scope="row"]{font-weight:800;color:var(--text-1);font-size:13px}
.rec td.fresh{background:var(--accent-soft);transition:background 1.2s}
.rec td.chg b{font-weight:800}
.rec td.chg small{font-size:12px;color:var(--text-2)}
.unit-note{margin:6px 0 0;font-size:12px;line-height:1.5;color:var(--text-2)}
.found{margin:8px 0 0;display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:var(--r-2);font-size:13px;line-height:1.6}
.found:empty{display:none}
.found svg.ic{flex:none;color:var(--warn);margin-top:2px}
.found b{font-weight:800}
.found.pop{animation:pop 1.2s var(--ease-out)}
@keyframes pop{0%{background:var(--warn-soft)}100%{background:transparent}}
.seg button svg.ic{width:16px;height:16px;vertical-align:-3px;margin-right:4px}
/* 우주 팽창 단계 */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.step{position:relative}
.step:not(:last-child)::before{content:'';position:absolute;left:21px;top:36px;bottom:-8px;width:2px;background:var(--line-1)}
.step.done::before{background:var(--ok)}
.step-h{position:relative;display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:6px 8px;border:0;border-radius:var(--r-2);background:transparent;color:var(--text-2);font:600 15px/1.3 var(--font-ui);text-align:left;cursor:pointer}
.step .sn{width:28px;height:28px;flex:none;display:grid;place-items:center;border:1.5px solid var(--line-2);border-radius:50%;background:var(--surface-1);font:800 13px/1 var(--font-ui)}
.step .sn svg.ic{width:15px;height:15px;stroke-width:2.4}
.step.done .sn{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.step.cur .step-h{color:var(--text-1);font-weight:800}
.step.cur .sn{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
@media (hover:hover) and (pointer:fine){.step-h:hover{background:var(--surface-2);color:var(--text-1)}}
.step-b{padding:2px 6px 12px 46px}
.step-b p{margin:0 0 8px;font-size:15px;line-height:1.7;max-width:40ch}
.step-b b{font-weight:800}
.step-b .ask{font-weight:700;color:var(--text-1)}
.step-b .chips{margin:4px 0 10px}
.keypt{display:flex;gap:6px;align-items:flex-start;padding:8px 10px;border-radius:var(--r-2);background:var(--accent-soft);color:var(--text-1);font-weight:700;font-size:13px!important;line-height:1.5!important}
.keypt svg.ic{flex:none;width:16px;height:16px;color:var(--accent);margin-top:1px}
.panel-foot .grow{flex:1}
.panel-foot{align-items:center}
.rng-inline{display:flex;align-items:center;gap:10px;flex:1;min-width:220px}
.rng-inline input{flex:1;min-width:120px}
.rng-inline output{min-width:4.5ch;font:800 15px/1 var(--font-ui);text-align:right;white-space:nowrap}
.rng-inline.wide output{min-width:11ch}

/* 문제 화면 공통 */
.quiz{height:100%;overflow:auto;overscroll-behavior:contain;scrollbar-gutter:stable;margin:-12px -16px -14px;position:relative}
.quiz-in{max-width:1240px;margin:0 auto;padding:20px 20px 48px}
.quiz-in.narrow{max-width:820px}
.qz-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.qz-head h1{font:800 clamp(22px,2.2vw,26px)/1.2 var(--font-ui);letter-spacing:-.03em}
.qz-head p{margin:6px 0 0;color:var(--text-2);font-size:15px}
.qz-score{display:flex;align-items:baseline;gap:6px;font:600 13px/1 var(--font-ui);color:var(--text-2)}
.qz-score b{font:800 28px/1 var(--font-ui);color:var(--text-1)}
.qdots{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:14px}
.qdot{position:relative;width:32px;height:32px;border:1px solid var(--line-2);border-radius:var(--r-full);background:transparent;color:var(--text-2);font:700 12px/1 var(--font-ui);font-variant-numeric:tabular-nums;cursor:pointer}
.qdot::before{content:'';position:absolute;inset:-6px -2px}
.qdot.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--text-1)}
.qdot.bad{background:var(--danger-soft);border-color:var(--danger);color:var(--text-1);border-style:dashed}
.qdot.cur{outline:2px solid var(--accent);outline-offset:1px;color:var(--text-1)}
.qz-card{padding:20px 22px;border:1px solid var(--line-1);border-radius:var(--r-3);background:var(--surface-1)}
.qz-k{margin:0 0 8px;font:600 13px/1.3 var(--font-ui);color:var(--text-2);display:flex;align-items:center;gap:8px}
.qtag{padding:3px 8px;border-radius:var(--r-1);background:var(--surface-2);color:var(--text-1);font:700 12px/1.3 var(--font-ui)}
.qz-q{font:700 18px/1.55 var(--font-ui);margin:0 0 12px}
.qz-fig{margin:4px 0 14px;max-width:520px}
.qgraph,.qcells{width:100%;height:auto}
.qcells{max-width:300px}
.fc-lit{fill:var(--warn)}
:root[data-theme="light"] .fc-lit{fill:var(--data-1)}
.fc-grid{stroke:var(--text-1);stroke-width:1;opacity:.55;fill:none}
.fc-edge{fill:none;stroke:var(--text-2);stroke-width:1.5}
.fc-t{font:600 12px var(--font-ui);fill:var(--text-2);text-anchor:middle}
.g-pt-t{font:700 11px var(--font-ui);fill:var(--text-1)}
.qtable{border-collapse:collapse;font-size:15px;min-width:320px}
.qtable caption{caption-side:top;text-align:left;font:600 13px/1.4 var(--font-ui);color:var(--text-2);padding-bottom:6px}
.qz-fig .stage-fig{border-radius:var(--r-2);max-width:520px}
.qtable th,.qtable td{padding:6px 14px;border:1px solid var(--line-2);text-align:center}
.qtable thead th{background:var(--surface-2);font:700 13px/1.3 var(--font-ui);color:var(--text-2)}
.qtable tbody th{font-weight:800}
.qtable td{font-weight:700;font-variant-numeric:tabular-nums}
.opts{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.opt{position:relative;width:100%;display:flex;align-items:center;gap:10px;min-height:48px;padding:8px 12px;border:1px solid var(--line-2);border-radius:var(--r-2);background:var(--surface-0);color:var(--text-1);font:500 15px/1.5 var(--font-ui);text-align:left;cursor:pointer;transition:background var(--dur-fast),border-color var(--dur-fast)}
.opt .on{flex:none;width:26px;height:26px;display:grid;place-items:center;border:1.5px solid var(--line-2);border-radius:50%;font:800 13px/1 var(--font-ui);color:var(--text-2);font-variant-numeric:tabular-nums}
.opt.right .on{border-color:var(--ok);color:var(--ok)}.opt.wrong .on{border-color:var(--danger);color:var(--danger)}
.opt .ot{flex:1}
.opt .om{flex:none;display:inline-flex;align-items:center;gap:4px;font:800 13px/1 var(--font-ui)}
.opt .om svg.ic{width:16px;height:16px}
.opt.right{border-color:var(--ok);background:var(--ok-soft);border-width:2px;padding:7px 11px}
.opt.right .om{color:var(--ok)}
.opt.wrong{border-color:var(--danger);background:var(--danger-soft);border-style:dashed}
.opt.wrong .om{color:var(--danger)}
.opt.dim{opacity:.6}
.opt[aria-disabled="true"]{cursor:default}
@media (hover:hover) and (pointer:fine){.opt:not([aria-disabled="true"]):hover{border-color:var(--accent);background:var(--surface-2)}}
.qz-fb{margin-top:12px;padding:12px 14px;border-radius:var(--r-2);border-left:4px solid var(--ok);background:var(--ok-soft)}
.qz-fb.bad{border-left-color:var(--danger);background:var(--danger-soft)}
.qz-fb p{margin:0;font-size:15px;line-height:1.65}
.qz-fb .fb-h{font-weight:800;margin-bottom:2px}
.qz-acts{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.qz-acts .grow{flex:1}
.result .res-big{font:800 clamp(22px,2.4vw,28px)/1.3 var(--font-ui);margin:0 0 6px}
.res-line{margin:0 0 14px;color:var(--text-2)}
.wrong-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.qz-foot{margin:14px 0 0}
.textlink{display:inline-flex;align-items:center;gap:6px;min-height:44px;color:var(--text-2);font:600 13px/1 var(--font-ui);text-decoration:none}
.textlink svg{width:20px;height:20px}
.textlink .yt-body{fill:currentColor}.textlink .yt-play{fill:var(--surface-1)}
.textlink:is(:hover,:focus-visible){color:var(--text-1)}
.textlink:is(:hover,:focus-visible) .yt-body{fill:var(--yt-red)}.textlink:is(:hover,:focus-visible) .yt-play{fill:var(--yt-play)}
/* 탐구 질문 */
.prog{display:flex;align-items:center;gap:10px;font:600 13px/1 var(--font-ui);color:var(--text-2)}
.prog .dots{display:flex;gap:4px}
.prog .dots i{width:18px;height:6px;border-radius:var(--r-full);background:var(--line-2)}
.prog .dots i.done{background:var(--accent)}
.policy{margin:0 0 14px;padding:10px 14px;border-radius:var(--r-2);background:var(--surface-1);border:1px solid var(--line-1);font:500 13px/1.6 var(--font-ui)}
.policy p{margin:0}.policy .save-note{color:var(--text-2);margin-top:2px}
.qlist{display:grid;gap:12px}
.qcard{border:1px solid var(--line-1);border-radius:var(--r-3);background:var(--surface-1)}
.qcard summary{list-style:none;display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 16px;cursor:pointer;border-radius:var(--r-3)}
.qcard summary::-webkit-details-marker{display:none}
.qcard .qn{width:28px;height:28px;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--surface-2);font:800 13px/1 var(--font-ui)}
.qcard .qt{font:700 15px/1.4 var(--font-ui);min-width:0}
.badges{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto;justify-content:flex-end}
.badge{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:var(--r-full);border:1px solid var(--line-2);font:600 12px/1.2 var(--font-ui);color:var(--text-2);white-space:nowrap}
.badge svg.ic{width:13px;height:13px}
.badge.ok{color:var(--ok);border-color:currentColor}
.badge.lock{background:var(--ok-soft);color:var(--text-1);border-color:transparent}
.badge.rev{background:var(--accent-soft);color:var(--text-1);border-color:transparent}
.badge.hint{background:var(--warn-soft);color:var(--text-1);border-color:transparent}
.chev{color:var(--text-2);transition:transform var(--dur-fast) var(--ease-out)}
.qcard[open] .chev{transform:rotate(90deg)}
@media (hover:hover) and (pointer:fine){.qcard summary:hover{background:var(--surface-2)}}
.qbody{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;padding:0 16px 18px;align-items:start}
figure.mini{margin:0;position:sticky;top:8px;border:1px solid var(--line-1);border-radius:var(--r-2);background:var(--st-bg-1);overflow:hidden}
.mini figcaption{display:flex;flex-wrap:wrap;align-items:baseline;gap:3px 8px;padding:8px 12px;border-bottom:1px solid var(--line-1);background:var(--surface-1);font:500 13px/1.5 var(--font-ui)}
.mini figcaption .tag{padding:2px 7px;border-radius:var(--r-1);background:var(--accent-soft);color:var(--text-1);font:700 12px/1.3 var(--font-ui)}
.mini figcaption b{font-weight:800}
.mini figcaption .how{color:var(--text-2);flex-basis:100%}
.mini-stage{position:relative;width:100%;height:clamp(230px,44dvh,340px);touch-action:pan-y;user-select:none;-webkit-user-select:none;background:var(--st-bg-1)}
.mini-ctl .mrng{flex:1;min-width:140px}
.mini-ctl .mk{font:600 12px/1 var(--font-ui);color:var(--text-2)}
.mini-stage>svg{position:absolute;inset:0;width:100%;height:100%}
.mini-result{margin:0;padding:8px 12px;min-height:46px;border-top:1px solid var(--line-1);background:var(--surface-1);font:500 13px/1.55 var(--font-ui);font-variant-numeric:tabular-nums}
.mini-result b{font-weight:800}
.mini-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 12px;border-top:1px solid var(--line-1);background:var(--surface-1)}
.qq{margin:0 0 8px;font:700 18px/1.55 var(--font-ui)}
.qtext .qtable{margin:0 0 8px}
.qsrc{margin:0 0 14px;font:400 13px/1.5 var(--font-ui);color:var(--text-2)}
.alabel{display:block;margin-bottom:6px;font:600 13px/1.3 var(--font-ui);color:var(--text-2)}
.qtext textarea{width:100%;min-height:120px;padding:10px 12px;border:1px solid var(--line-2);border-radius:var(--r-2);background:var(--surface-0);color:var(--text-1);font:400 16px/1.6 var(--font-ui);resize:vertical}
.qtext textarea.locked{background:var(--surface-2);color:var(--text-2)}
.arow{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 8px;margin:4px 0 8px;font:500 12px/1.4 var(--font-ui);color:var(--text-2)}
.lockline{display:inline-flex;align-items:center;gap:4px;color:var(--text-1);font-weight:600}
.lockline svg.ic{width:14px;height:14px}
.abtns{display:flex;gap:6px;flex-wrap:wrap}
.hintp,.modelp,.revp{margin-top:8px;padding:10px 12px;border-radius:var(--r-2);font:400 15px/1.65 var(--font-ui)}
.hintp{background:var(--warn-soft)}
.hintp p,.modelp p{margin:0}
.hintp small{display:block;margin-top:4px;color:var(--text-2);font-size:12px}
.modelp{background:var(--ok-soft)}
.modelp h4,.revp h4{display:flex;align-items:center;gap:6px;margin:0 0 4px;font:800 13px/1.3 var(--font-ui)}
.modelp mark{background:none;color:inherit;font-weight:800;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;text-decoration-color:var(--ok)}
.revp{background:var(--accent-soft)}
.revp .revnote{margin:0 0 6px;font-size:13px;color:var(--text-2)}
.revp .cnt{display:block;margin-top:4px;font-size:12px;color:var(--text-2)}
.quiz-end{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:20px 2px 12px}

/* 서랍 · 모달 · 토스트 */
dialog{color:var(--text-1)}
.drawer{position:fixed;inset:0 0 0 auto;margin:0;height:100dvh;max-height:100dvh;width:clamp(360px,34vw,480px);max-width:100vw;padding:0;border:0;border-left:1px solid var(--line-1);background:var(--surface-1);box-shadow:var(--edge-hi),var(--shadow-3);flex-direction:column}
.drawer[open]{display:flex}
dialog::backdrop{background:var(--scrim)}
dialog.sheet{opacity:0;transform:translateX(var(--lift));transition:opacity var(--dur-ui-out) var(--ease-in),transform var(--dur-ui-out) var(--ease-in),overlay var(--dur-ui-out) allow-discrete,display var(--dur-ui-out) allow-discrete}
dialog.sheet[open]{opacity:1;transform:none;transition-duration:var(--dur-ui);transition-timing-function:var(--ease-out)}
@starting-style{dialog.sheet[open]{opacity:0;transform:translateX(var(--lift))}}
.modal.sheet{transform:translateY(var(--lift))}
@starting-style{.modal.sheet[open]{opacity:0;transform:translateY(var(--lift))}}
.dialog-head{display:flex;align-items:center;gap:8px;padding:14px 12px 12px 20px;border-bottom:1px solid var(--line-1)}
.dialog-head h2{flex:1;font:800 18px/1.3 var(--font-ui)}
.dialog-body{flex:1;overflow:auto;overscroll-behavior:contain;padding:16px 20px 32px}
.card+.card{margin-top:28px;padding-top:24px;border-top:1px solid var(--line-1)}
.card .k{font:700 12px/1 var(--font-ui);color:var(--accent);margin:0 0 6px}
.card h3{font:800 18px/1.35 var(--font-ui);margin-bottom:12px}
.card .fig{border-radius:var(--r-2);overflow:hidden;border:1px solid var(--line-1);margin-bottom:12px;background:var(--st-bg-1)}
.card .fig svg{display:block;width:100%;height:auto}
.card p{margin:0 0 8px;font:400 15px/1.7 var(--font-ui);max-width:44ch}
.card .def{font-weight:600}
.card ul{margin:0 0 8px;padding-left:1.1em;font-size:15px;line-height:1.65;max-width:44ch}
.card .link-line{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:var(--r-2);background:var(--surface-2);font-size:13px;line-height:1.55;max-width:none}
.card .link-line svg.ic{margin-top:2px;color:var(--accent)}
.tf-bg{fill:var(--st-bg-1)}
.tf-src{fill:var(--st-light)}
.tf-ray{stroke:var(--st-light);stroke-width:1.5;opacity:.7}
.tf-sq{fill:var(--st-light);stroke:var(--st-light);stroke-width:1.5}
.tf-grid{fill:none;stroke:var(--st-grid-ink);stroke-width:1.4;opacity:.8}
.tf-t{font:700 19px var(--font-ui);fill:var(--st-text-1);text-anchor:middle}
.tf-v{font:800 19px var(--font-ui);fill:var(--st-accent);text-anchor:middle}
.tf-s{font:600 16px var(--font-ui);fill:var(--st-text-2);text-anchor:middle}
.tf-s.lab{fill:var(--st-text-1);paint-order:stroke;stroke:var(--st-bg-1);stroke-width:4;stroke-linejoin:round}
.tf-star{fill:var(--sp-G)}
.tf-glow{fill:var(--st-light)}
.tf-glow.sp-A,.tf-glow.sp-M{fill:var(--c)}
.tf-core{fill:var(--c)}
.tf-arc,.tf-big{fill:none;stroke:var(--st-accent);stroke-width:2}
.tf-ring{fill:none;stroke:var(--st-accent);stroke-width:2.5}
.tf-ring-t{font:800 16px var(--font-ui);fill:var(--st-accent)}
.tf-earth{fill:var(--st-earth-sea);stroke:var(--st-earth-hi)}
.modal{width:min(640px,calc(100vw - 32px));max-height:min(86dvh,760px);padding:0;border:1px solid var(--line-1);border-radius:var(--r-3);background:var(--surface-1);box-shadow:var(--edge-hi),var(--shadow-3);flex-direction:column}
.modal.narrow{width:min(460px,calc(100vw - 32px))}
.modal[open]{display:flex}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:16px}
.help-doc h3{font:800 15px/1.35 var(--font-ui);margin:20px 0 6px}
.help-doc h3:first-child{margin-top:0}
.help-doc ol,.help-doc ul{margin:0;padding-left:20px;font-size:15px;line-height:1.7}
.help-doc li+li{margin-top:4px}
.help-doc p{margin:0 0 6px;font-size:15px;line-height:1.7}
.help-doc .keys{line-height:2.2}
.wipe-list{margin:0 0 10px;padding-left:20px;line-height:1.7}
.brandblock{margin-top:20px;padding:16px;border-radius:var(--r-2);background:var(--surface-2);font:500 13px/1.8 var(--font-ui)}
.brandblock a{color:var(--text-1)}
.ver-line{color:var(--text-2);font-size:13px!important;margin-top:12px!important}
.toast{position:fixed;left:50%;top:calc(var(--top-h) + 10px);transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:10px;max-width:min(380px,calc(100vw - 32px));padding:10px 14px;border-radius:var(--r-2);background:var(--text-1);color:var(--surface-0);font:600 13px/1.5 var(--font-ui);box-shadow:var(--shadow-3)}
.toast.error{background:var(--danger-soft);color:var(--text-1);border:1px solid var(--danger)}
.toast-x{flex:none;width:30px;height:30px;display:grid;place-items:center;border:0;background:transparent;color:inherit;cursor:pointer}

/* 반응형 */
@media (max-width:1180px){.lab-head .goal{flex-basis:100%;order:3}.top-title .std{display:none}}
@media (max-width:1040px){.qbody{grid-template-columns:minmax(0,1fr)}figure.mini{position:static}}
@media (max-width:860px){
  body{overflow:auto;height:auto;display:block}
  .appbody{min-height:calc(100dvh - var(--top-h))}

  .lab{height:auto}
  .lab-grid{grid-template-columns:minmax(0,1fr)}

}

  .brand{gap:5px}
  .brandmark{width:24px;height:24px}
  .word{font-size:12px}
  .topbar>.vdiv,.top-title,.utilities .hsep,#helpBtn{display:none}
  .social{width:34px;height:40px}
  .social::before{inset:-2px 3px}
  .social svg{width:19px;height:19px}
  .icon-btn{width:36px;height:40px}
  .icon-btn::before{inset:-2px 2px}
  .appbody{display:block;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
  .rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;z-index:25;flex-direction:row;gap:2px;padding:4px 4px calc(4px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line-1)}
  .rail button{flex:1;min-height:54px;gap:3px;padding:6px 0}
  .rail button svg.ic{width:21px;height:21px}
  .rail button .l{display:none}
  .rail button .s{display:block}
  .rail button[aria-current="page"]::after{left:24%;right:24%;top:-4px;bottom:auto;width:auto;height:3px;border-radius:0 0 3px 3px}
  main{padding:10px 0 16px}
  .lab{gap:8px}
  .lab-head{padding:0 12px}
  .bench,.panel{border-radius:0;border-left:0;border-right:0}
  .lab-grid{gap:10px}
  .tool.save span{display:none}
  .tool.save{width:44px;height:44px;padding:0;justify-content:center}
  .bench-head{align-items:flex-start}
  .tool span{display:none}.tool.primary span{display:inline}
  .bh-k,.bh-sep,.chip .u{display:none}
  .chip{min-width:40px;padding:0 8px}
  .status{font-size:15px;padding:10px 12px}
  .panel-foot{bottom:calc(62px + env(safe-area-inset-bottom))}
  .quiz{margin:-10px 0 -16px}
  .quiz-in{padding:14px 0 32px}
  .qz-head,.qdots,.policy,.quiz-end{margin-left:12px;margin-right:12px}
  .qz-card{border-radius:0;border-left:0;border-right:0;padding:16px 14px}
  .qcard{border-radius:0;border-left:0;border-right:0}
  .qcard summary{flex-wrap:wrap;padding:10px 12px}
  .badges{flex-basis:100%;justify-content:flex-start;order:3;margin-left:40px}
  .qbody{padding:2px 0 14px}
  figure.mini{border-radius:0;border-left:0;border-right:0}
  .mini-stage{height:auto;aspect-ratio:446/316}.mini-stage.mini-bread{aspect-ratio:460/330}.mini-stage.mini-history{aspect-ratio:1000/600}
  .qtext{padding:0 12px}
  .drawer{inset:auto 0 0 0;width:100vw;height:86dvh;border-left:0;border-top:1px solid var(--line-1);border-radius:var(--r-3) var(--r-3) 0 0}
  dialog.drawer.sheet{transform:translateY(var(--lift))}
  dialog.drawer.sheet[open]{transform:none}
  .toast{left:12px;right:12px;top:auto;transform:none;bottom:calc(76px + env(safe-area-inset-bottom));max-width:none}
  .lab-bench .stage{--ar:378/356}
  .seg button span{display:none}
  .seg button svg.ic{margin-right:0}
  .step-b{padding-left:14px}
  .step:not(:last-child)::before{display:none}

}

<script>
/* ───────────────────────── 과학 값 한 곳: 풍선 모형 · 우주 모형 · 표기 · 아이콘 ─────────────────────────
   과학 진실층(§5.5.5): 이 파일의 값과 함수만 수치를 만든다. 장면·표·저장 이미지·간이 실험이 모두 여기서 값을 읽는다.
   교육과정 [9과15-03] 해설대로 적색 편이·허블 법칙·가속 팽창은 다루지 않는다(식·용어를 화면에 쓰지 않는다). */
const APP_VERSION = '1.0';
const APP_DATE = '2026-09-26';
const LAB_ID = 'expansion';
const LAB_TITLE = '우주 팽창';
const LAB_FILE = '우주팽창';

/* ── 풍선 모형: 고무풍선 몸통은 구(지름 D). 풍선을 불면 모양은 그대로 크기만 커진다(닮은꼴 팽창) ──
   붙임딱지는 몸통의 같은 방향(위도·경도)에 붙어 있고 크기가 변하지 않는다. 줄자는 표면을 따라(대원) 잰다. */
const D_MIN = 100, D_MAX = 280;          // mm: 지름 10 ~ 28 cm (12인치 풍선이 터지지 않는 범위)
const D_SMALL = 120, D_MID = 180, D_BIG = 240;
const STICKER_D = 20;                    // 원형 붙임딱지 지름 mm
const TAPE_W = 13;                       // 재봉 줄자 폭 mm
const PUMP_STROKE = 90;                  // 펌프 손잡이가 움직이는 거리 mm
const PUMP_VOL = 800e3;                  // 한 번 끝까지 밀 때 들어가는 공기 mm³(0.8 L) — 체험을 위해 실제 풍선 펌프보다 크게 잡음
const volOf = D => Math.PI / 6 * D * D * D;
const dOfVol = V => Math.cbrt(6 * V / Math.PI);
/* 붙임딱지 방향: az = 정면에서 오른쪽(+)으로 돈 각, el = 위(+)로 든 각. ①–② 3.0 cm, ①–③ 8.0 cm, ②–③ 6.0 cm(지름 12 cm) */
function dirOf(az, el) { const a = az * Math.PI / 180, e = el * Math.PI / 180; return [Math.sin(a) * Math.cos(e), Math.sin(e), Math.cos(a) * Math.cos(e)]; }
const STICKERS = [
  { n: 1, az: -34.54, el: 20.17 }, { n: 2, az: -12.26, el: 41.75 }, { n: 3, az: 45.7, el: 13.5 },
  { n: 4, az: -3.0, el: 0.9 }, { n: 5, az: 29.6, el: 50.2 }, { n: 6, az: 23.4, el: -22.5 },
].map(s => Object.assign(s, { u: dirOf(s.az, s.el) }));
const STK = n => STICKERS[n - 1];
const dot3 = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross3 = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const norm3 = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
const angOf = (a, b) => Math.acos(Math.max(-1, Math.min(1, dot3(a, b))));
function arcMM(D, i, j) { return D / 2 * angOf(STK(i).u, STK(j).u); }          // 표면을 따라 잰 거리(mm)
function tapeRead(D, i, j) { return Math.round(arcMM(D, i, j)); }              // 줄자 읽기: 1 mm(0.1 cm) 단위
const GRID_DEG = 20;                                                          // 마커 격자 한 칸 = 20°
function gridCellMM(D) { return Math.round(D / 2 * GRID_DEG * Math.PI / 180); } // 적도에서 격자 한 칸의 폭(mm)
const PAIRS = [[1, 2], [1, 3], [2, 3]];                                        // 교과서 표의 세 쌍

/* ── 건포도 빵 모형(탐구 질문): 반죽이 k배로 부풀면 건포도 사이 거리도 k배, 건포도 크기는 그대로 ── */
const RAISINS = [
  { k: 'A', x: -22, y: 38 }, { k: 'B', x: -2, y: 38 }, { k: 'C', x: 28, y: 38 },
  { k: '', x: -58, y: 20 }, { k: '', x: 55, y: 22 }, { k: '', x: -40, y: 62 }, { k: '', x: 12, y: 70 },
  { k: '', x: 44, y: 58 }, { k: '', x: -8, y: 12 }, { k: '', x: 26, y: 14 }, { k: '', x: -26, y: 84 },
];
const RAISIN_BY = Object.fromEntries(RAISINS.filter(r => r.k).map(r => [r.k, r]));
function raisinMM(k, a, b) { const p = RAISIN_BY[a], q = RAISIN_BY[b]; return Math.round(k * Math.hypot(p.x - q.x, p.y - q.y)); }

/* ── 우주 모형 ──
   은하는 ‘공동 좌표’(우주 공간에 붙은 자리)에 있고, 화면 위치 = 기준 은하와의 공동 좌표 차 × 크기 비율 a.
   공동 좌표 상자는 가로·세로 3.0의 주기 경계(어느 은하를 기준으로 삼아도 둘레가 고르게 채워진다).
   안드로메다은하는 우리은하와 가까워 예외: 우주 팽창을 따르지 않고 조금씩 다가온다. */
const BOX = 3.0, HALF = BOX / 2;
const wrap = v => { v = (v + HALF) % BOX; if (v < 0) v += BOX; return v - HALF; };
function mulberry(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const GALAXIES = (() => {
  const rnd = mulberry(20260926), out = [
    { id: 'mw', x: 0, y: 0, type: 'bar', s: 1.7, rot: -20, tilt: .92, name: '우리은하' },
    { id: 'm31', x: .17, y: -.12, type: 'sp', s: 1.45, rot: -38, tilt: .36, name: '안드로메다은하' },
  ];
  const dist = (a, b) => Math.hypot(wrap(a.x - b.x), wrap(a.y - b.y));
  let tries = 0;
  while (out.length < 118 && tries < 20000) {
    tries++;
    const c = { x: rnd() * BOX - HALF, y: rnd() * BOX - HALF };
    if (out.some(g => dist(g, c) < (g.id === 'mw' || g.id === 'm31' ? .3 : .215))) continue;
    const el = rnd() < .34;
    out.push({ id: 'g' + out.length, x: c.x, y: c.y, type: el ? 'el' : 'sp', s: .72 + rnd() * .55, rot: rnd() * 360, tilt: el ? .6 + rnd() * .35 : .32 + rnd() * .66 });
  }
  // 기준으로 고르기 쉬운 이름 붙은 은하 A·B·C (우리은하에서 서로 다른 방향)
  const pick = (tx, ty) => out.filter(g => !g.name).sort((a, b) => Math.hypot(a.x - tx, a.y - ty) - Math.hypot(b.x - tx, b.y - ty))[0];
  [['A', -.62, .3], ['B', .58, .22], ['C', .12, -.55]].forEach(([k, x, y]) => { const g = pick(x, y); g.name = '은하 ' + k; g.key = k; g.type = 'sp'; g.s = 1.15; g.tilt = Math.max(g.tilt, .55); });
  return out;
})();
const GX_BY = Object.fromEntries(GALAXIES.map(g => [g.id, g]));
const REF_KEYS = [['mw', '우리은하'], [GALAXIES.find(g => g.key === 'A').id, '은하 A'], [GALAXIES.find(g => g.key === 'B').id, '은하 B'], [GALAXIES.find(g => g.key === 'C').id, '은하 C']];
const M31_OFF = [GX_BY.m31.x - GX_BY.mw.x, GX_BY.m31.y - GX_BY.mw.y];
const m31Off = a => 1 + 1.3 * (1 - a);                 // 안드로메다은하: 시간이 흐를수록 조금씩 가까워진다
/* 기준 은하에서 본 은하 i의 위치(크기 비율 a일 때, 공동 좌표 단위) */
function relPos(i, ref, a) {
  const bi = i === 'm31' ? 'mw' : i, br = ref === 'm31' ? 'mw' : ref;
  const gi = GX_BY[bi], gr = GX_BY[br];
  let x = wrap(gi.x - gr.x) * a, y = wrap(gi.y - gr.y) * a;
  const f = m31Off(a);
  if (i === 'm31') { x += M31_OFF[0] * f; y += M31_OFF[1] * f; }
  if (ref === 'm31') { x -= M31_OFF[0] * f; y -= M31_OFF[1] * f; }
  return [x, y];
}
/* 우주의 역사: 현재 과학자들이 쓰는 표준 우주 모형(물질 31 %·암흑 에너지 69 %)의 크기 비율.
   t는 대폭발 뒤 흐른 시간(억 년), 현재 T0 = 138억 년에서 a = 1. 화면에는 ‘은하 사이의 거리: 현재의 약 ○ %’로만 쓴다. */
const T0 = 138;
const XL = Math.asinh(Math.sqrt(.69 / .31));
function scaleAt(t) { return t <= 0 ? 0 : Math.pow(Math.sinh(XL * t / T0) / Math.sinh(XL), 2 / 3); }
const GX_FORM = [3, 10];                                 // 은하가 생기기 시작해 자리 잡는 시기(대폭발 뒤 억 년) — 표현용
function gxShow(t) { return clamp((t - GX_FORM[0]) / (GX_FORM[1] - GX_FORM[0]), 0, 1); }
/* 역사 그림 속 ‘우주의 한 부분’(원) 안의 은하: 원 안 공동 좌표(반지름 1) */
const HIST_GX = (() => {
  const rnd = mulberry(1380), out = [];
  let tries = 0;
  while (out.length < 34 && tries < 5000) {
    tries++;
    const r = Math.sqrt(rnd()) * .9, th = rnd() * Math.PI * 2, c = { x: r * Math.cos(th), y: r * Math.sin(th) };
    if (out.some(g => Math.hypot(g.x - c.x, g.y - c.y) < .2)) continue;
    out.push({ x: c.x, y: c.y, el: rnd() < .3, rot: rnd() * 360 });
  }
  return out;
})();

const cm1 = mm => (Math.round(mm) / 10).toFixed(1);           // mm → "3.0"

function jn(n, pair) { const [a, b] = pair.split('/'), bat = [1, 3, 6].includes(n); return pair === '으로/로' ? (n === 3 || n === 6 ? a : b) : bat ? a : b; }
const nb = n => `<span class="nb" role="img" aria-label="붙임딱지 ${n}">${n}</span>`;           // 화면 글자 속 붙임딱지 번호(장면의 붙임딱지와 같은 모양)

/* ───────────────────────── 풍선 실험대: 탁자 위 풍선 펌프 · 노즐에 끼운 고무풍선 · 붙임딱지 · 재봉 줄자 ─────────────────────────

const TILT = 12 * Math.PI / 180, CT = Math.cos(TILT), ST = Math.sin(TILT);

/* 풍선 윤곽: 몸통 원 + 목으로 좁아지는 부분 + 목 관(펌프 노즐 또는 매듭) */

  for (let i = 1; i < sA.length; i++) s += `L${P(sA[i])}`;
  for (let i = sB.length - 1; i >= 0; i--) s += `L${P(sB[i])}`;
  s += `C${P(c2b)} ${P(c2a)} ${P(J2)}A${F1(R)} ${F1(R)} 0 1 0 ${P(J1)}Z`;
  // 목 쪽 그늘(고무가 덜 늘어나 두껍고 어둡다)
  const shade = `M${P(J1)}C${P(c1a)} ${P(c1b)} ${P(sA[0])}L${P(sB[0])}C${P(c2b)} ${P(c2a)} ${P(J2)}Z`;
  return { d: s, shade, line, dir: d, end: line[line.length - 1], w, F, C0: add(S, d, R * Math.cos(th)) };
}

/* 마커 격자: 몸통에 고정된 위도·경도선(20°). 풍선과 함께 늘어나고 선 굵기도 굵어진다 */

  let d = '';
  const run = (ptsU) => {
    let open = false;
    for (const u of ptsU) {
      if (visOf(u) > .015) { const p = sp(S, R, u); d += `${open ? 'L' : 'M'}${F1(p[0])} ${F1(p[1])}`; open = true; } else open = false;
    }

/* 붙임딱지: 구의 접평면을 화면으로 옮기는 행렬로 그린다(가장자리로 갈수록 납작하게 보인다) */

  const cls = ['stk', o.sel ? 'sel' : '', o.pend ? 'pend' : '', o.ref ? 'ref' : ''].join(' ');

/* 줄자: 두 붙임딱지 중심을 잇는 대원(표면에서 가장 짧은 길)을 따라 옆에 나란히 댄 천 줄자. 0 눈금 = 앞 붙임딱지 중심 */

/* 화면에 나란한 알약 이름표 (글자 수로 폭을 잡는다) */

}
/* 붙임딱지가 화면에서 차지하는 원(이름표가 피할 자리) */

/* 기준점 둘레에서 붙임딱지·다른 이름표와 겹치지 않는 자리를 고른다(방향 순서대로, 가까운 거리부터) */

/* 한 붙임딱지에서 모두 재기: 기준에서 다른 붙임딱지까지 표면을 따라 잇는 선과 거리(cm) */

  let s = '';

    const ua = STK(ref).u, ub = STK(j).u, al = angOf(ua, ub), sa = Math.sin(al);
    const g = th => { const k1 = Math.sin(al - th) / sa, k2 = Math.sin(th) / sa; return [ua[0] * k1 + ub[0] * k2, ua[1] * k1 + ub[1] * k2, ua[2] * k1 + ub[2] * k2]; };

/* 풍선 한 개(몸통·격자·붙임딱지). 실험대·간이 실험·원리 카드·문항 그림이 모두 이 함수로 그린다 */

  stop() { if (this.anim) { cancelAnimationFrame(this.anim); this.anim = null; } }
  destroy() { this.stop(); if (this.ro) this.ro.disconnect(); }
}

/* ───────── 건포도 빵(탐구 질문 간이 실험): 반죽 단면 · 1 유닛 = 1 mm ───────── */
class BreadScene {
  constructor(host, o = {}) { this.host = host; this.o = Object.assign({ prefix: 'r' + Math.random().toString(36).slice(2, 6) }, o); this.s = o.state; this.onChange = o.onChange || (() => { }); }
  build() {
    const p = this.o.prefix;
    this.host.innerHTML = '';
    const svg = this.svg = el('svg', { viewBox: '120 40 460 330', class: 'scene-svg bread-svg mini-svg', role: 'img', 'aria-label': '쟁반 위 건포도 빵 반죽의 자른 단면. 건포도 A, B, C 사이를 점선으로 이었다' }, this.host);
    svg.innerHTML = `<defs><linearGradient id="${p}-wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="st-wall-0"/><stop offset="1" class="st-wall-1"/></linearGradient>
      <radialGradient id="${p}-dough" cx=".42" cy=".3" r=".8"><stop offset="0" class="st-dough-hi"/><stop offset="1" class="st-dough"/></radialGradient></defs>
      <rect class="bg" x="0" y="0" width="800" height="500" fill="url(#${p}-wall)"/><g class="l-main"></g>`;
    this.main = svg.querySelector('.l-main');
    this.render();
    return this;
  }
  render() {
    const k = this.s.k, p = this.o.prefix, B = [350, 322], W = 172 * k, H = 104 * k;
    let s = `<rect class="tray-top" x="140" y="${B[1]}" width="420" height="7" rx="2"/><rect class="tray" x="150" y="${B[1] + 7}" width="400" height="10" rx="2"/>`;
    s += `<ellipse class="shadow" cx="${B[0] + 6}" cy="${B[1] + 1}" rx="${f1(W / 2 + 6)}" ry="5"/>`;
    s += `<path class="dough" d="M${f1(B[0] - W / 2)} ${B[1]}A${f1(W / 2)} ${f1(H)} 0 0 1 ${f1(B[0] + W / 2)} ${B[1]}Z" fill="url(#${p}-dough)"/>`;
    s += `<path class="crust" d="M${f1(B[0] - W / 2)} ${B[1]}A${f1(W / 2)} ${f1(H)} 0 0 1 ${f1(B[0] + W / 2)} ${B[1]}"/>`;
    const pos = r => [B[0] + k * r.x, B[1] - k * r.y];
    const A = pos(RAISIN_BY.A), Bb = pos(RAISIN_BY.B), Cc = pos(RAISIN_BY.C);
    RAISINS.forEach((r, i) => { const q = pos(r); s += `<ellipse class="raisin" cx="${f1(q[0])}" cy="${f1(q[1])}" rx="5.4" ry="3.6" transform="rotate(${(i * 53) % 180 - 60} ${f1(q[0])} ${f1(q[1])})"/><ellipse class="raisin-hi" cx="${f1(q[0] - 1.4)}" cy="${f1(q[1] - 1.2)}" rx="1.8" ry="1"/>`; });
    s += `<path class="spoke dark" d="M${f1(A[0])} ${f1(A[1] + 9)}V${f1(A[1] + 30 * k)}M${f1(Bb[0])} ${f1(Bb[1] + 9)}V${f1(Bb[1] + 18 * k)}M${f1(Cc[0])} ${f1(Cc[1] + 9)}V${f1(Cc[1] + 30 * k)}"/>`;
    const yAB = A[1] + 18 * k, yAC = A[1] + 30 * k;
    s += `<path class="bm-line" d="M${f1(A[0])} ${f1(yAB)}H${f1(Bb[0])}M${f1(A[0])} ${f1(yAC)}H${f1(Cc[0])}"/>`;
    s += pill((A[0] + Bb[0]) / 2, yAB - 11, cm1(raisinMM(k, 'A', 'B')), 13, 'spk');
    s += pill((A[0] + Cc[0]) / 2 + 12, yAC + 13, cm1(raisinMM(k, 'A', 'C')) + ' cm', 13, 'spk');
    ['A', 'B', 'C'].forEach(key => { const q = pos(RAISIN_BY[key]); s += `<text class="raisin-k" x="${f1(q[0])}" y="${f1(q[1] - 9)}">${key}</text>`; });
    s += `<text class="h-big small" x="136" y="72">×${k.toFixed(2)}</text><text class="h-sub small" x="136" y="96">반죽이 부푼 정도</text>`;
    s += `<text class="fig-note" x="136" y="362">빵 반죽을 자른 단면 · 건포도 크기는 그대로</text>`;
    this.main.innerHTML = s;
  }
  setK(k, animate) {
    this.stop();
    k = clamp(k, 1, 1.6);
    if (!animate || REDUCED) { this.s.k = k; this.render(); this.onChange(); return; }
    const k0 = this.s.k, t0 = performance.now(), T = 1800;
    const step = now => { const e = Math.min(1, (now - t0) / T); this.s.k = lerp(k0, k, easeInOut(e)); this.render(); this.onChange(); if (e < 1) this.anim = requestAnimationFrame(step); else this.anim = null; };
    this.anim = requestAnimationFrame(step);
  }
  stop() { if (this.anim) { cancelAnimationFrame(this.anim); this.anim = null; } }
  destroy() { this.stop(); }
  fitText() { }
}

function recModel() {

    <p>화면 오른쪽 위 <b>결과 저장</b>(또는 <kbd>C</kbd>)을 누르면 지금 장면과 조건·값이 담긴 PNG 한 장이 기기의 다운로드 폴더에 저장돼요(iPad는 저장 확인 창).</p>
    <h3>모형의 조건과 한계</h3>
    <ul><li>풍선 몸통은 공 모양으로 보고, 불면 모양은 그대로 크기만 커진다고 가정했어요. 그래서 표면의 모든 거리가 같은 배율로 늘어나요. 실제 풍선은 목 쪽이 덜 늘어나는 등 조금 다를 수 있어요.</li>
      <li>거리는 붙임딱지 중심 사이를 풍선 표면을 따라(가장 짧은 길) 잰 값이고, 줄자는 0.1 cm(1 mm) 단위로 읽어요. 붙임딱지는 지름 2 cm로 크기가 변하지 않아요.</li>
      <li>펌프 한 번에 들어가는 공기(0.8 L)는 체험을 위해 실제 풍선 펌프보다 크게 잡았어요. 풍선은 지름 ${cm1(D_MAX)} cm까지만 불어요.</li>
      <li>마커 격자는 풍선에 펜으로 그린 선이라고 가정했어요. 고무와 함께 늘어나므로 우주 공간을 나타내는 데 써요.</li>
      <li>은하 그림의 크기와 거리는 실제 비율과 달라요. 안드로메다은하처럼 아주 가까운 은하는 우주 팽창을 따르지 않아 예외로 그렸어요.</li>
      <li>‘팽창하는 우주의 과거’의 크기 변화는 현재 과학자들이 쓰는 우주 모형 값으로 그렸어요. 원은 우주 전체가 아니라 우주의 한 부분을 나타내요.</li>
      <li>성취기준 해설에 따라 적색 편이·허블 법칙·가속 팽창 같은 심화 내용은 다루지 않아요.</li></ul>
    <h3>출처와 제작</h3>
    <p>2022 개정 중학교 과학 ‘별과 우주’ 단원 여러 교과서의 탐구(풍선 모형으로 알아보는 우주 팽창, 풍선으로 우주 팽창 알아보기, 풍선 팽창으로 우주 팽창 설명하기)를 참고해 새로 구성했어요. 성취기준 [9과15-03] 모형을 이용하여 우주가 팽창하고 있음을 설명할 수 있다.</p>
    <h3>기록 지우기</h3>
    <p>기록표·객관식·탐구 질문 답안은 이 탭에만 저장되고, 탭을 닫으면 지워져요.</p>
    <button class="btn" id="wipeBtn">${icon('trash')}이 탭의 모든 기록 지우기</button>
    <div class="brandblock">🧪 송쌤과학 (Song Ssaem Science)<br>ⓒ 2026 송세호 | 아주중학교<br>📺 YouTube: <a href="${CHANNELS.yt}" target="_blank" rel="noopener noreferrer">@songsamscience</a> 📷 Instagram: <a href="${CHANNELS.ig}" target="_blank" rel="noopener noreferrer">@songsamscience</a><br>⚠ 무단 복제·상업적 이용 금지</div>
    <p class="ver-line">v${APP_VERSION} · ${APP_DATE}</p></div>`, {
    onOpen: () => {
      $('#wipeBtn').onclick = () => openModal('모든 기록을 지울까요?', `<p>이 탭에 남은 다음 기록이 모두 지워져요.</p><ul class="wipe-list"><li>풍선 실험 기록표와 풍선 상태</li><li>우주 팽창 화면의 단계와 설정</li><li>객관식 답과 탐구 질문 답안(처음 답안 잠금·다시 쓴 답안 포함)</li></ul><p class="muted">테마 설정은 남아요.</p>
        <div class="dialog-actions"><button class="btn" data-close>그대로 두기</button><button class="btn primary" id="wipeYes">모두 지우기</button></div>`, {
        narrow: true, onOpen: () => {
          $('#wipeYes').onclick = () => {
